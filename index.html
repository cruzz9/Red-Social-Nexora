<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"

<body id="indexBody">
    <!--parte 1 NavBar-->
    <header>
        <nav id="header"></nav>
    </header>

    <!--LEO-->
  <div class="post-card m-2 w-100 mx-auto" id="seccionPublicarDudaFija">
    <div class="p-1">
        <div class="style-pointer" id="toggleDudaForm" style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
    
    <div class="text-white" style="background-color: #0ea5e9 !important; width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 400; padding-bottom: 4px; line-height: 1; user-select: none;">
        +
    </div>
    
    <h2>Publicar Duda</h2>
</div>

        <div id="dudaFormContainer" class="d-none mt-3">
            <textarea id="textoNuevaDuda" class="form-control mb-3" rows="3" placeholder="Escribe tu duda detalladamente aquí..."></textarea>
            
            <div class="mb-3 text-center containerImage" style="border-radius: 8px; overflow: hidden;">
                <img id="preview" class="imageCard" src="" alt="Vista previa" style="display: none;">
            </div>

            <div class="d-flex justify-content-between align-items-center">
                
                <div>
                    <label for="imagen" class="btnCardOptions" style="padding: 6px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px;">
                        <i class="fa-solid fa-camera-retro" style="font-size: 1.2rem;"></i>
                    </label>
                    <input type="file" id="imagen" accept="image/*" style="display: none;">
                </div>

                <div class="d-flex gap-2">
    <button type="button" id="btnCancelarDuda" class="btn">
        CANCELAR
    </button>

    <button type="button" id="btnPublicarDudaCard">
        PUBLICAR
    </button>
</div>
            </div>
        </div>
    </div>
</div>

        <div id="prodRow" class="w-100 d-flex flex-column align-items-center justify-content-center">
            </div>
        
    </div>
</section>


    <section>
        <div class="container d-flex ">

            <div class="col">

                <div class="container my-4 p-3 rounded shadow-sm post-card" style="position: relative;">
                    <h3 class="mb-3 text-primary"><i class="fa-solid fa-pen-to-square me-2"></i>Nueva Publicación</h3>
                    
                    <form id="postForm">
                        <div class="mb-3">
                            <label for="inputNombre" class="form-label fw-bold" style="color:aliceblue">Nombre Completo</label>
                            <input type="text" class="form-control" id="inputNombre" placeholder="Ej. Raul Medina" required>
                        </div>
                
                        <div class="mb-3">
                            <label for="inputRol" class="form-label fw-bold" style="color:aliceblue">Rol o Especialidad</label>
                            <input type="text" class="form-control" id="inputRol" placeholder="Ej. Developer Jr. / Specialist" required>
                        </div>
                
                        <div class="mb-3">
                            <label for="textareaDescripcion" class="form-label fw-bold" style="color:aliceblue">¿Qué quieres compartir hoy?</label>
                            <textarea class="form-control" id="textareaDescripcion" rows="3" placeholder="Escribe aquí tu idea, duda técnica o mensaje..." required></textarea>
                        </div>
                
                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="fa-solid fa-paper-plane me-2"></i>Publicar en Tiempo Real
                        </button>
                    </form>
                </div>
                
                <div id="prodRow" class="row  justify-content-center p-3">
                    <!-- aqui empieza la tarjeta -->
                    
                    <!-- aqui temrina la tarjeta-->
                </div>
            </div>
        </div>

    </section>

    <footer id="footer"></footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" type="module"></script>
    <script src="./JS/postcotroller.js" type="module"></script>
    <script src="./JS/footer.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</body>

</html>
