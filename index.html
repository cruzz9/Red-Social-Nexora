<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./CSS/navbar.css">
    <link rel="stylesheet" href="./CSS/index.css">


</head>
<!-------------------------------------------------------------------->

<body id="indexBody">
    <!--parte 1 NavBar-->
    <header>
        <nav id="header"></nav>
    </header>

<!--Contenedor que gestiona 3 columnas en la pagina-->

<div class="container-fluid pt-4">
    <div class="row justify-content-center">
    <!-- COLUMNA IZQUIERDA -->   
        <aside class="col-lg-3 d-none d-lg-block">
            <div class="card border-info custom-card-bg p-3 sticky-top custom-sticky-aside">
                <h5 class="text-white mb-3">Mi Perfil</h5>
                <hr class="text-secondary opacity-25">
                
                <!-- Estado 1: Usuario Invitado / No ha iniciado sesión -->
                <div id="perfil-invitado" class="text-center my-4">
                    <p class="text-white-50 small mb-3">Únete a la comunidad STEM para conectar con mentores y compartir ideas.</p>
                    <!-- El botón vincula directamente a la página de login requerida en el proyecto -->
                    <a href="login.html" class="btn btn-login-accent w-100 fw-bold py-2">
                        Iniciar Sesión
                    </a>
                </div>
        
                <!-- Estado 2: Usuario Autenticado (Oculto inicialmente por CSS o JS) -->
                <div id="perfil-autenticado" class="text-center my-3" style="display: none;">
                    <div class="bg-secondary rounded-circle mx-auto mb-2" style="width: 70px; height: 70px;"></div>
                    <h6 class="text-white m-0">Usuario Nexora</h6>
                    <small class="text-muted">Estudiante STEM</small>
                </div>
            </div>
        </aside>

    <!--Formulario de crear publicacion-->

    <!-- COLUMNA CENTRAL: El Feed  -->
    <main class="col-12 col-md-10 col-lg-6">

    <div class="post-card m-2 w-100 mx-auto" id="seccionPublicarDudaFija">
        <div class="p-1">
            <div class="style-pointer" id="toggleDudaForm" style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
    
                <div class="text-white" style="background-color: #0ea5e9 !important; width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 400; padding-bottom: 4px; line-height: 1; user-select: none;">
                +
                </div>
    
            <h2 >Nueva Publicación</h2>
            </div>

        <div id="dudaFormContainer" class="d-none mt-3">
            <textarea id="textoNuevaDuda" class="form-control mb-3" rows="3" placeholder="Escribe tu idea..."></textarea>
            
            <div class="mb-3 text-center containerImage" style="border-radius: 8px; overflow: hidden;">
                <img id="preview" class="imageCard" src="" alt="Vista previa" style="display: none;">
            </div>

            <div class="d-flex justify-content-between align-items-center">
                
                <div>
                    <label for="imagen" class="btnCardOptions" style="padding: 6px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px;">
                        <i class="fa-solid fa-camera-retro" style="font-size: 1.2rem;"></i>
                    </label>
                    <input type="file" id="imagen" accept="image/*" style="display: none;">
                </div>

                <div class="d-flex gap-2">
                    <button type="button" id="btnCancelarDuda" class="btn">CANCELAR</button>
                    <button type="submit" class="btn btn-primary w-100 fw-bold" style="background-color: #0EA5E9;" id="btnPublicarDudaCard">
                        <i class="fa-solid fa-paper-plane me-2"></i>Publicar en Tiempo Real
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
    <!--Seccion donde se alojan las publicaciones-->
    <section>
        <div class="container d-flex ">

            <div class="col">

                
                <div id="prodRow" class="row  justify-content-center p-3">
                    <!-- aqui empieza la tarjeta -->
                    
                    <!-- aqui temrina la tarjeta-->
                </div>
            </div>
        </div>

    </section>
    </main>

    <!-- COLUMNA DERECHA: Tendencias / Dudas Populares -->
    <aside class="col-lg-3 d-none d-lg-block">
        <div class="card border-info custom-card-bg p-3 sticky-top custom-sticky-aside">
            <h5 class="text-white mb-3">Tendencias STEM</h5>
            <hr class="text-secondary opacity-25">
            <ul class="list-group list-group-flush bg-transparent">
                <li class="list-group-item bg-transparent text-white-50 border-0 px-0 py-2">
                    <a href="#" class="text-decoration-none trend-link">#JavaFullStack</a>
                </li>
                <li class="list-group-item bg-transparent text-white-50 border-0 px-0 py-2">
                    <a href="#" class="text-decoration-none trend-link">#ArquitecturaDeSoftware</a>
                </li>
                <li class="list-group-item bg-transparent text-white-50 border-0 px-0 py-2">
                    <a href="#" class="text-decoration-none trend-link">#Ciberseguridad</a>
                </li>
            </ul>
        </div>
    </aside>

</div>
</div>

    <footer id="footer"></footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" type="module"></script>
    <script src="./JS/postcotroller.js" type="module"></script>
    <script src="./JS/footer.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</body>

</html>
