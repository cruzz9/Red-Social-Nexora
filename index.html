<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./CSS/navbar.css">
    <link rel="stylesheet" href="./CSS/index.css">


</head>
<!-------------------------------------------------------------------->

<body id="indexBody">
    <!--parte 1 NavBar-->
    <header>
        <nav id="header"></nav>
    </header>

    <section>
        <div class="container d-flex ">

            <div class="col">

                <div class="container my-4 p-3 rounded shadow-sm post-card" style="position: relative;">
                    <h3 class="mb-3 text-primary"><i class="fa-solid fa-pen-to-square me-2"></i>Nueva Publicación</h3>
                    
                    <form id="postForm">
                        <div class="mb-3">
                            <label for="inputNombre" class="form-label fw-bold" style="color:aliceblue">Nombre Completo</label>
                            <input type="text" class="form-control" id="inputNombre" placeholder="Ej. Raul Medina" required>
                        </div>
                
                        <div class="mb-3">
                            <label for="inputRol" class="form-label fw-bold" style="color:aliceblue">Rol o Especialidad</label>
                            <input type="text" class="form-control" id="inputRol" placeholder="Ej. Developer Jr. / Specialist" required>
                        </div>
                
                        <div class="mb-3">
                            <label for="textareaDescripcion" class="form-label fw-bold" style="color:aliceblue">¿Qué quieres compartir hoy?</label>
                            <textarea class="form-control" id="textareaDescripcion" rows="3" placeholder="Escribe aquí tu idea, duda técnica o mensaje..." required></textarea>
                        </div>
                
                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="fa-solid fa-paper-plane me-2"></i>Publicar en Tiempo Real
                        </button>
                    </form>
                </div>
                
                <div id="prodRow" class="row  justify-content-center p-3">
                    <!-- aqui empieza la tarjeta -->
                    
                    <!-- aqui temrina la tarjeta-->
                </div>
            </div>
        </div>

    </section>

    <footer id="footer"></footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" type="module"></script>
    <script src="./JS/postcotroller.js" type="module"></script>
    <script src="./JS/footer.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</body>

</html>
