<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"

        <link rel="stylesheet" href="./CSS/navbar.css">
        <link rel="stylesheet" href="./CSS/login.css"><!--login.css-->

<body id="body-login">
    
   <header>
  <nav id="header"></nav>
</header>

    <div class="container-fluid px-4">
    <div class="row align-items-center min-vh-100">
        <!-- Formulario más grande -->
        <div class="col-md-7 col-lg-6 col-xl-5 mx-auto">
            <form class="p-4 p-md-5">
                <div class="mb-4">
                    <label for="InputEmail" class="form-label fs-4">Usuario</label>
                    <input type="email" class="form-control form-control-lg" id="InputEmail">
                </div>
                <div class="mb-4">
                    <label for="InputPassword" class="form-label fs-4">Contraseña</label>
                    <input type="password" class="form-control form-control-lg" id="InputPassword">
                    <a id="email" class="form-text fs-5" href="#">¿Olvidaste Contraseña?</a>
                </div>
                <div class="d-grid gap-3">
                    <button type="submit" class="btn fs-4">Iniciar Sesion</button>
                    <button id="btnCrearCuenta" type="button" class="btn fs-4">Crear Cuenta</button>
                </div>
            </form>
        </div>  
        
        <!-- Imagen -->
        <div class="col-md-5 col-lg-6 text-center d-none d-md-block">
            <img class="img-icon" src="./assets/nexora_icono.png" alt="iconN" style="max-width: 400px;">
        </div>
    </div>
</div>





   
    <footer id="footer"></footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" type="module"></script>
    <script src="./JS/login.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./JS/footer.js"></script> 
</body>

</html>
