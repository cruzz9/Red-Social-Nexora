<!-- Formulario con los campos Nombre, telefono email y Mensaje -->
<!-- crear las alertas-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./CSS/cuenta.css">
    <link rel="stylesheet" href="./CSS/navbar.css">

</head>
<!-------------------------------------------------------------------->

<body id="bodyCuenta">
    <!--parte 1 -->
    <header>
        <nav id="header"></nav>
    </header>


    <section id="formulario" class="pt-3">

        <div class="row container-fluid text-center">
            <h1>
                <h1 id="tiutloCuenta">Únete a Nexora</h1>
                <p id="parrafoCuenta">Crea tu cuenta y forma parte una comunidad que te conecta con lo que más te
                    importa.</p>
            </h1>
        </div>
        <div class="row container-fluid">
            <div class="col d-none d-md-block">
                <img class="img-fluid" id="imgCuenta" src="./assets/cuentaHTML.jpeg" alt="NEXORA">
            </div>

            <div class="col-md-4 mt-5">
                <!-- 🔽 AGREGAMOS EL FORM AQUÍ DENTRO -->
                <form id="formContacto">

                    <!-- Nombre -->

                    <div class="row d-flex flex-column align-items-center">
                        <label for="nameIpt" class="formFormat w-75"> Nombre: </label>
                        <input id="nameIpt" name="nombre" type="text" class="form-control w-75"
                            placeholder="Escribe tu nombre aquí..." required>
                        <div id="nameAlert" class="alert alert-danger w-75" style="display:none;">
                            Debes ingresar tu nombre.
                        </div>
                    </div>


                    <!-- Apellido -->
                    <div class="row d-flex flex-column align-items-center">
                        <label for="lastIpt" class="formFormat w-75"> Apellido: </label>
                        <input id="lastIpt" name="apellido" type="text" class="form-control w-75"
                            placeholder="Escribe tu primer apellido" required>
                        <div id="lastAlert" class="alert alert-danger w-75" style="display:none;">
                            Debes ingresar tu apellido.
                        </div>
                    </div>

                    <!--Fecha de nacimiento-->
                    <div class="row d-flex flex-column align-items-center">
                        <label for="dateIpt" class="formFormat w-75"> Fecha de nacimiento: </label>
                        <input id="dateIpt" name="fecha" type="date" class="form-control w-75">
                        <div id="dateAlert" class="alert alert-danger w-75" style="display:none;">
                            Debes ingresar tu fecha de nacimiento.
                        </div>
                    </div>

                    <!--genero-->
                    <div class="row d-flex flex-column align-items-center">
                        <label for="genderIpt" class="formFormat w-75"> Género: </label>

                        <select id="genderIpt" class="form-select w-75">
                            <option value="" disabled selected hidden>Selecciona tu género</option>
                            <option value="femenino">Femenino</option>
                            <option value="masculino">Masculino</option>
                            <option value="prefieroNoResponder">Prefiero no responder</option>
                        </select>

                    </div>

                    <!-- Email -->
                    <div class="row d-flex flex-column align-items-center">
                        <label for="emailIpt" class="formFormat w-75"> Email: </label>
                        <input id="emailIpt" name="email" type="email" class="form-control w-75"
                            placeholder="ejemplo@correo.com" required>
                        <div id="emailAlert" class="alert alert-danger w-75" style="display:none;">
                            Debes ingresar tu correo.
                        </div>
                    </div>

                    <!-- Teléfono -->
                    <div class="row d-flex flex-column align-items-center">
                        <label for="phoneIpt" class="formFormat w-75"> Teléfono: </label>
                        <input id="phoneIpt" name="telefono" type="tel" class="form-control w-75"
                            placeholder="Ej. 1234567890" required>
                        <div id="phoneAlert" class="alert alert-danger  w-75" style="display:none;">
                            Debes ingresar tu teléfono.
                        </div>
                    </div>


                    <!-- contraseña -->
                    <div class="row d-flex flex-column align-items-center">
                        <label for="paswordIpt" class="formFormat w-75"> Contraseña </label>
                        <input id="paswordIpt" name="password" type="pas" class="form-control w-75"
                            placeholder="Ingresa una contraseña" required>
                        <div id="phoneAlert" class="alert alert-danger  w-75" style="display:none;">
                            Debes ingresar tu contraseña.
                        </div>
                    </div>


                    <!-- Botones -->
                    <div class="row d-flex flex-column align-items-center">
                        <div class="row mt-3">
                            <div class="form-check form-switch ">
                                <input class="form-check-input" type="checkbox" value="" id="checkNativeSwitch" switch>
                                <label class="form-check-label" for="checkNativeSwitch">
                                    Native switch haptics
                                </label>
                            </div>
                            <div id="btnContainer">
                                <button id="formBtn" type="submit" class="btn btn-primary btnFormat">Crear</button>
                                <button id="delBtn" type="button" class="btn btn-danger btnFormat">Cancelar</button>
                            </div>
                        </div>
                    </div>

                </form>
                <!-- 🔼 CIERRE DEL FORM -->

            </div>
        </div>
    </section>

    <footer id="footer"></footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" type="module"></script>
    <script src="./JS/footer.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./JS/contactanos.js"></script>
</body>

</html>
