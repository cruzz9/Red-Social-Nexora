<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
     <link rel="stylesheet" href="./CSS/perfil.css">
     <link rel="stylesheet" href="./CSS/navbar.css">
     <link rel="stylesheet" href="./CSS/avatar.css">
     <!-- Enlace para cargar los iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<!-------------------------------------------------------------------->

<body>

    <header>
        <nav id="header"></nav>
    </header>

    <main class="container py-5">

   <!-- PERFIL -->
        <section class="profile-card mb-4">
          
            <div class="row align-items-center mb-4">
                
                <div class="col-lg-3 col-md-4 text-center text-md-start">
                    <div class="perfil-avatar">
                        <img id="fotoPerfil" class="profile-img" src="AVATAR.png" alt="Avatar">
                    </div>
                </div>

                <div class="col-lg-6 col-md-5 text-center text-md-start">
                    <h2 id="nombrePerfil" class="profile-name">Juan Perez</h2>
                    <p id="carreraPerfil" class="profile-career">Software Developer</p>
                </div>

                <div class="col-lg-3 col-md-3 text-center text-md-end d-flex flex-column gap-2 align-items-center align-items-md-end mt-3 mt-md-0">
                    <button id="editarAvatar" class="btn-profile-action">
                        <i class="fas fa-magic"></i> Personalizar Avatar
                    </button>
                    <button id="btnEditar" class="btn-profile-action">
                        <i class="fas fa-edit"></i> Editar Perfil
                    </button>
                </div>
            </div>

            <!-- Estadísticas -->
            <div class="row">
                <div class="col-12">
                    <div class="estadisticas-perfil-horizontal">
                        <div class="estadistica-h">
                            <span class="stat-number">490</span>
                            <small class="stat-label">Siguiendo</small>
                        </div>
                        <div class="estadistica-h">
                            <span class="stat-number">1.2K</span>
                            <small class="stat-label">Seguidores</small>
                        </div>
                        <div class="estadistica-h">
                            <span class="stat-number">470</span>
                            <small class="stat-label">Conexiones</small>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!--  CONTENIDO  -->

        <div class="row g-4">

            <!--  IZQUIERDA -->

            <aside class="col-lg-3 d-flex align-items-start">

                <div class="card w-100 sticky-card">

                    <h4>Sobre mí</h4>

                    <p id="sobreMi">Cuéntanos de ti...</p>

                </div>

            </aside>

            <!-- CENTRO -->

            <section class="col-lg-6 order-3 order-lg-2">

                <!-- Nueva Publicación -->

                <div
                    class="post-card"
                    id="nuevaPublicacion">

                    <div
                        class="post-header"
                        id="togglePublicacion">

                        <div class="icono-publicar">

                            +

                        </div>

                        <h2>

                            Nueva Publicación

                        </h2>

                    </div>

                    <div class="post-body">

                        <textarea id="textoPublicacion"placeholder="Escribe tu idea..."></textarea>

                        <div class="botones-publicacion">

                            <button class="btn-cancelar">

                                Cancelar

                            </button>

                            <button class="btn-publicar">

                                <i class="bi bi-send-fill"></i>

                                Publicar

                            </button>

                        </div>

                    </div>

                </div>

                <!-- AQUÍ VAN LAS PUBLICACIONES -->

                <div id="contenedorPublicaciones"></div>

            </section>

            <!-- DERECHA -->

            <aside class="col-lg-3 order-2 order-lg-3">

                <div class="card w-100 sticky-card">

                    <h4>

                        Sobre tu carrera

                    </h4>

                    <p id="sobreCarrera">Presenta tu carrera...</p>
                </div>

            </aside>

        </div>

    </main>

    <!-- MODAL AVATAR -->

    <div
        id="modalAvatar"
        class="avatar-modal">

        <div class="avatar-box">

            <span
                id="cerrarAvatar"
                class="cerrar-modal">

                &times;

            </span>

            <h2>

                🎨 Personalizar Avatar

            </h2>

            <div class="avatar-contenido">

                <!-- Preview -->

                <div class="avatar-preview">

                    <img
                        id="previewAvatar"
                        class="preview-avatar">

                </div>

                <!-- Opciones -->

                <div class="avatar-opciones">

                    <label>

                        Estilo

                    </label>

                    <select id="estilo">

                        <option value="adventurer">Adventurer</option>
                        <option value="adventurer-neutral">Adventurer Neutral</option>
                        <option value="bottts">Bottts</option>
                        <option value="fun-emoji">Fun Emoji</option>
                        <option value="pixel-art">Pixel Art</option>

                    </select>

                    <label>

                        Color de fondo

                    </label>

                    <select id="fondo">

                        <option value="b6e3f4">Azul</option>
                        <option value="ffd5dc">Rosa</option>
                        <option value="ffdfbf">Naranja</option>
                        <option value="d1d4f9">Morado</option>
                        <option value="ffffff">Blanco</option>

                    </select>

                    <label>

                        Nombre del Avatar

                    </label>

                    <input
                        id="seed"
                        type="text"
                        placeholder="...">

                    <button id="generarAvatar">

                        🎲 Generar Aleatorio

                    </button>

                </div>

            </div>

            <div class="avatar-botones">

                <button id="cancelarAvatar">

                    Cancelar

                </button>

                <button id="guardarAvatar">

                    Guardar Avatar

                </button>

            </div>

        </div>

    </div>

    <footer id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" type="module"></script>
    <script src="./JS/perfil.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./JS/footer.js"></script>
    <script src="./JS/avatar.js"></script>
</body>

</html>
