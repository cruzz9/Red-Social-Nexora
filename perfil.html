<head>
    <meta charset="UTF-8">

<body>
    <!--parte 1 Mauro-->
   <header>
  <nav id="header"></nav>
</header>
<!--PERFIL-->
    <main class="container py-5">
        <section class="profile-card">

            <!-- Banner -->
            <div class="profile-banner">
                <img src="./assets/banner.png" class="img-fluid w-100" alt="Banner">
            </div>

            <div class="container">
                <div class="row align-items-center profile-content gy-4">

                    <!-- FOTO -->
                    <div class="col-lg-2 col-md-3 col-12 text-center">
                        <img src="./assets/fotodeperfil.png"
                            alt="Foto de Perfil"
                            class="profile-img">
                        <button class="btn btn-edit mt-3">
                            Editar Perfil
                        </button>
                    </div>

                    <!-- INFORMACIÓN -->
                    <div class="col-lg-5 col-md-9 col-12">
                        <h2 class="profile-name">
                            Carlos Medina
                        </h2>
                        <p class="profile-career">
                            Ingeniero Químico
                        </p>
                        <p class="profile-location">
                            Universidad Nacional Autónoma de México |
                            Ciudad de México
                        </p>
                    </div>          

    <div class="row mt-4">

    <!-- Columna izquierda -->
    <div class="col-lg-8">

        <!-- feed/publicaciones -->
    </div>

    <!-- Columna derecha -->
    <div class="col-lg-4 mt-4 mt-lg-0">

        <!-- Datos sobre tu carrera -->
        <div class="side-card mb-4">
            <h4>Datos sobre tu carrera</h4>
            <div class="career-item">
                <h6 class="career-myth">Mito</h6>
                <p>
                    Se trabaja únicamente en laboratorios.
                </p>
            </div>

            <div class="career-item">
                <h6 class="career-reality">Realidad</h6>
                <p>
                    Existe demanda en industrias alimentarias,
                    farmacéuticas, energéticas y ambientales.
                </p>
            </div>
        </div>

    <footer id="footer"></footer>

        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" type="module"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./JS/footer.js"></script>
